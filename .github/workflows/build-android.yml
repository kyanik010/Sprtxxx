name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/**']
    paths:
      - '**.kt'
      - '**.kts'
      - '**.xml'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch VPN engine submodules
        run: |
          git submodule update --init vendor/OpenVPNGateClientApp
          git -C vendor/OpenVPNGateClientApp submodule update --init --recursive src/external/OpenVPNEngine

      - name: Install SWIG
        run: sudo apt-get update && sudo apt-get install -y swig

      - name: Use stable Android SDK level for VPN engine
        run: |
          sed -i 's/compileSdk = 37/compileSdk = 36/; s/targetSdk = 37/targetSdk = 36/' vendor/OpenVPNGateClientApp/src/external/OpenVPNEngine/main/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |\n            platform-tools\n            platforms;android-36\n            build-tools;36.0.0\n            ndk;29.0.14206865\n            cmake;3.22.1
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate local debug signing key
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build and test
        run: gradle testDebugUnitTest assembleDebug -PPRIMARY_SERVERS_URL=https://openvpngateclient.azurewebsites.net -PFALLBACK_SERVERS_URL=https://www.vpngate.net/api/iphone/ --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MatchNight-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
