name: Build Android APK
# Keep this workflow on the feature branch so VPN engine compatibility fixes are built and verified.

on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/**']
    paths:
      - '**.kt'
      - '**.kts'
      - '**.xml'
      - 'gradle/**'
      - '.gitmodules'
      - 'vendor/**'
      - 'scripts/**'
      - 'gradlew'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch VPN engine submodules
        run: |
          git submodule update --init vendor/OpenVPNGateClientApp
          git -C vendor/OpenVPNGateClientApp submodule update --init --recursive src/external/OpenVPNEngine

      - name: Patch vendored OpenVPN engine for AGP 9
        run: python3 scripts/patch-openvpn-engine-agp9.py

      - name: Install SWIG
        run: sudo apt-get update && sudo apt-get install -y swig

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;29.0.14206865 cmake;3.22.1
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          validate-wrappers: false

      - name: Generate local debug signing key
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build and test
        run: gradle --no-configuration-cache testDebugUnitTest assembleDebug -PPRIMARY_SERVERS_URL=https://openvpngateclient.azurewebsites.net -PFALLBACK_SERVERS_URL=https://www.vpngate.net/api/iphone/ --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MatchNight-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
